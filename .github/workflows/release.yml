name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          PALMGLASS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          PALMGLASS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PALMGLASS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PALMGLASS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "PalmGlass-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: PalmGlass-*.apk
          generate_release_notes: true
